# Project-wide Gradle settings.
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# JVM args for the Gradle daemon. -Xmx4g is enough to run kapt/Room annotation
# processing over this codebase without OOMing on CI runners.
org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options\="-Xmx4g" -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
# Jetifier has been removed in AGP 8; the app is fully on AndroidX now.
android.enableJetifier=false

# Keep non-transitive R classes disabled so that legacy `R` references in the
# shared `awais.instagrabber` package continue to resolve.
android.nonTransitiveRClass=false

# compileSdk 36 is the current stable API; silence the "not tested with this AGP"
# warning on toolchain versions that lag the SDK release.
android.suppressUnsupportedCompileSdk=36
